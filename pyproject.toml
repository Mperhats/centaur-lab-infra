[project]
name = "centaur-lab-infra"
version = "0.1.0"
description = "GitOps lifecycle commands for the centaur-system deployment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cloudflared-tunnel",
]

[project.scripts]
up = "infra.up:main"
sync = "infra.sync:main"
status = "infra.status:main"
clean = "infra.clean:main"
down = "infra.down:main"
secrets = "infra.secrets:main"
bump = "infra.bump:main"
forward = "infra.forward:main"
bfts-status = "infra.bfts_status:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["infra"]
exclude = ["infra/cloudflared/**"]

[tool.uv.workspace]
members = ["infra/cloudflared"]

[tool.uv.sources]
cloudflared-tunnel = { workspace = true }
