global:
  imagePullSecrets: []

secretManager:
  existingSecretName: centaur-infra-env
  envPrefix: ""

firewall:
  existingCaSecretName: centaur-firewall-ca
  existingCaKeySecretName: centaur-firewall-ca-key

# NOTE on base service images:
# The four core Centaur services (api, sandbox/agent, slackbot, iron-proxy)
# point at unqualified `centaur-*` repositories with `tag: latest` and
# `pullPolicy: IfNotPresent`. This is a deliberate dev-cluster deviation —
# Docker Desktop's Kubernetes resolves these names against the locally-built
# arm64 images already cached on this host (built by `just build-images` or
# similar in the centaur monorepo).
#
# The reason: paradigmxyz/centaur publishes amd64-only images at GHCR
# (paradigmxyz/centaur/.github/workflows/publish-images.yml lacks the
# `platforms: linux/amd64,linux/arm64` parameter). On Apple Silicon the
# kubelet asks for linux/arm64/v8 and gets ImagePullBackOff. Until upstream
# publishes multi-arch (or we mirror multi-arch into ghcr.io/mperhats/...),
# this dev cluster reads the base services from the local Docker daemon.
#
# The overlay image is unaffected — your overlay workflow already builds
# linux/amd64,linux/arm64, so we keep that one pinned to GHCR.
#
# When deploying to an amd64 cloud cluster, override these four blocks via a
# values overlay to point at GHCR with a sha- tag.

api:
  image:
    repository: centaur-api
    tag: latest
    pullPolicy: IfNotPresent
  defaultHarness: claude-code
  executionWorkerEnabled: true
  workflowWorkerEnabled: true
  warmPoolEnabled: false
  pluginWatcherEnabled: true
  slackEtlEnabled: true
  slackSyncBackfillLookbackDays: 700
  egressDiscovery:
    enabled: false
  extraEnv:
    BFTS_DRAFT_MODEL: claude-sonnet-4-20250514
    BFTS_FEEDBACK_MODEL: claude-sonnet-4-20250514
    BFTS_VLM_MODEL: claude-sonnet-4-20250514
    BFTS_LLM_API_KEY_SECRET: ANTHROPIC_API_KEY
    BFTS_NUM_SEEDS: "2"
    BFTS_REFLECTION_ENABLED: "1"
    WORKFLOW_WORKER_CONCURRENCY: "16"

overlay:
  image:
    repository: ghcr.io/mperhats/centaur-lab/centaur-overlay
    tag: sha-87bfef6
    pullPolicy: IfNotPresent
    sourcePath: /overlay

agentSandbox:
  enabled: true
  controller:
    extensions: true
    sandboxClaimConcurrentWorkers: 25
    sandboxWarmPoolConcurrentWorkers: 5

sandbox:
  controller: agent-sandbox
  image:
    repository: centaur-agent
    tag: latest
    pullPolicy: IfNotPresent
  reposPath: /var/lib/centaur/repos
  stateVolume:
    enabled: true
    size: 1Gi
    storageClassName: ""
  runtimeClassName: ""

slackbot:
  enabled: true
  image:
    repository: centaur-slackbot
    tag: latest
    pullPolicy: IfNotPresent

ironProxy:
  image:
    repository: centaur-iron-proxy
    tag: latest
    pullPolicy: IfNotPresent
  secretSource: env
  secretTtl: 10m

repoCache:
  enabled: true
  hostPath: /var/lib/centaur/repos
  syncIntervalSeconds: 300
  repositories:
    - Mperhats/centaur-lab
  githubToken:
    existingSecretName: centaur-infra-env
    secretKey: GITHUB_TOKEN

postgres:
  enabled: true
  auth:
    existingSecretName: centaur-infra-env
    existingSecretKey: POSTGRES_PASSWORD
  persistence:
    enabled: true
    size: 20Gi

ingress:
  enabled: false

networkPolicy:
  enabled: true
