# Helm values for the Centaur Application managed by Argo CD.
#
# These values overlay the chart defaults from
#   paradigmxyz/centaur:contrib/chart/values.yaml
# Anything that already matches the chart default is intentionally omitted so
# this file only encodes what is *unique* to the centaur-lab cluster.
#
# Image strategy on Apple Silicon (Docker Desktop):
#   paradigmxyz/centaur publishes amd64-only images. Docker Desktop's
#   "Use Rosetta for x86_64/amd64 emulation on Apple Silicon" toggle
#   (Settings → General) lets the host *run* amd64 binaries, but kubelet
#   still negotiates pulls as `linux/arm64/v8` and the upstream manifest
#   list returns no match → ImagePullBackOff.
#
#   The fix is to bypass platform negotiation by pinning each image to its
#   amd64-specific digest (`tag@sha256:...`). Kubelet pulls the digest
#   directly, gets the amd64 manifest, and Rosetta translates at runtime.
#
#   When upstream rebuilds these images, refresh the digests with:
#     for img in centaur-api centaur-slackbot centaur-agent centaur-iron-proxy; do
#       T=$(curl -s "https://ghcr.io/token?scope=repository:paradigmxyz/centaur/$img:pull" | jq -r .token)
#       curl -s -H "Authorization: Bearer $T" \
#         -H "Accept: application/vnd.oci.image.index.v1+json" \
#         "https://ghcr.io/v2/paradigmxyz/centaur/$img/manifests/latest" \
#         | jq -r --arg img "$img" '.manifests[] | select(.platform.architecture=="amd64" and .platform.os=="linux") | "\($img): \(.digest)"'
#     done
#
#   On amd64 production clusters: drop the `@sha256:...` portion of each
#   tag. Plain `:latest` (or pin a `sha-XXXXXXX` tag) is sufficient when
#   the host arch matches the manifest.

api:
  image:
    repository: ghcr.io/paradigmxyz/centaur/centaur-api
    tag: latest@sha256:0b166c154727c66d0d48ec6e145e5c605ef125f1d076d16c8596981cef66cd23
    pullPolicy: IfNotPresent
  defaultHarness: claude-code
  executionWorkerEnabled: true
  pluginWatcherEnabled: true
  slackEtlEnabled: true
  slackSyncBackfillLookbackDays: 700
  egressDiscovery:
    enabled: false
  extraEnv:
    BFTS_DRAFT_MODEL: claude-sonnet-4-20250514
    BFTS_FEEDBACK_MODEL: claude-sonnet-4-20250514
    BFTS_VLM_MODEL: claude-sonnet-4-20250514
    BFTS_LLM_API_KEY_SECRET: ANTHROPIC_API_KEY
    BFTS_NUM_SEEDS: "2"
    BFTS_REFLECTION_ENABLED: "1"
    WORKFLOW_WORKER_CONCURRENCY: "16"
    # Pinned content-hash tag for the BFTS sandbox runtime image. Built by
    # centaur-scientist's .github/workflows/bfts-executor.yml only when
    # Dockerfile.bfts-executor changes; the tag is sha256(Dockerfile).
    # When the Dockerfile is bumped, update this literal AND
    # tools/bfts_executor/client.py:_DEFAULT_EXECUTOR_IMAGE in the same
    # overlay PR — the two MUST track each other. No :latest fallback;
    # leaving this unset would let the sandbox pull whatever the executor
    # workflow last pushed under :latest (we no longer publish that tag,
    # but the env var is still the canonical override point).
    BFTS_EXECUTOR_IMAGE: ghcr.io/mperhats/centaur-lab/bfts-executor:df-227aef6f00472e96ed43f03cf0e216306745f3af68318f3b00c32f9fc17525ec

# Overlay image repository and tag are set in bootstrap/centaur.yaml's
# helm.parameters block so Argo CD Image Updater can bump the tag in place
# when a new sha-* build lands on the overlay GHCR repo. Don't duplicate
# them here — that creates two sources of truth.
overlay: {}

slackbot:
  image:
    repository: ghcr.io/paradigmxyz/centaur/centaur-slackbot
    tag: latest@sha256:305cc0faf4e57a33b516b8aa8dd78d7dd25434171873289cb2926608acfa51fe
    pullPolicy: IfNotPresent

ironProxy:
  image:
    repository: ghcr.io/paradigmxyz/centaur/centaur-iron-proxy
    tag: latest@sha256:a84354d1b695409c59429d6dd486d23b0cdd2decbf197e7b542938076c3a7291
    pullPolicy: IfNotPresent
  # Chart default is `onepassword`. We resolve tool/harness credentials from
  # the centaur-infra-env Secret instead, so iron-proxy reads them as plain
  # env vars.
  secretSource: env

agentSandbox:
  enabled: true
  controller:
    extensions: true
    sandboxClaimConcurrentWorkers: 25
    sandboxWarmPoolConcurrentWorkers: 5

sandbox:
  image:
    repository: ghcr.io/paradigmxyz/centaur/centaur-agent
    tag: latest@sha256:6ef1d57d31e3bb564d1090a000d7c56aab27a50dca1d4254e703e996af87e24f
    pullPolicy: IfNotPresent
  controller: agent-sandbox
  reposPath: /var/lib/centaur/repos
  stateVolume:
    enabled: true
    size: 1Gi

repoCache:
  enabled: true
  hostPath: /var/lib/centaur/repos
  syncIntervalSeconds: 300
  repositories:
    - Mperhats/centaur-lab
  githubToken:
    existingSecretName: centaur-infra-env
    secretKey: GITHUB_TOKEN
