apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: centaur
  namespace: argocd
  finalizers:
    # Cascade-delete every chart-managed resource when the Application is
    # deleted. Without this, `kubectl delete app centaur` orphans every
    # Deployment / Service / PVC in centaur-system. `/foreground` waits
    # for managed resources to actually disappear before clearing the App.
    - resources-finalizer.argocd.argoproj.io/foreground
  annotations:
    argocd-image-updater.argoproj.io/image-list: overlay=ghcr.io/mperhats/centaur-lab/centaur-overlay
    argocd-image-updater.argoproj.io/write-back-method: argocd
    argocd-image-updater.argoproj.io/overlay.helm.image-name: overlay.image.repository
    argocd-image-updater.argoproj.io/overlay.helm.image-tag: overlay.image.tag
    argocd-image-updater.argoproj.io/overlay.update-strategy: newest-build
    argocd-image-updater.argoproj.io/overlay.allow-tags: regexp:^sha-[0-9a-f]{7}$
spec:
  project: default
  sources:
    - repoURL: https://github.com/paradigmxyz/centaur.git
      targetRevision: 0656aeb56c9e6e98507494cfb1c0408ffbf57b65
      path: contrib/chart
      helm:
        valueFiles:
          - $values/clusters/centaur-lab/argocd/values/centaur.yaml
        parameters:
          # Argo CD Image Updater drives these two so future overlay builds
          # (matching ^sha-[0-9a-f]{7}$) auto-bump without manual edits.
          # Base service image tags come from values/centaur.yaml since they
          # are dev-cluster-local right now and not on Image Updater's path.
          - name: overlay.image.repository
            value: ghcr.io/mperhats/centaur-lab/centaur-overlay
            forceString: true
          - name: overlay.image.tag
            value: sha-2b6998d
            forceString: true
    - repoURL: https://github.com/Mperhats/centaur-lab-infra.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/Mperhats/centaur-lab-infra.git
      targetRevision: main
      path: clusters/centaur-lab/argocd/apps/centaur
  destination:
    namespace: centaur-system
    server: https://kubernetes.default.svc
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: baseline
        pod-security.kubernetes.io/warn: baseline
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
