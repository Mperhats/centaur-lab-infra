# Allow API workflow workers to reach the batch iron-proxy Service and let
# batch proxy egress to upstream providers. NetworkPolicies union when
# multiple policies select the same pod, so this supplements the Helm-managed
# centaur-centaur-api policy without editing the chart.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: centaur-api-egress-batch-proxy
  namespace: centaur-system
  labels:
    app.kubernetes.io/name: centaur
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
      app.kubernetes.io/instance: centaur
      app.kubernetes.io/name: centaur
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              centaur.ai/iron-proxy: "true"
              centaur.ai/sandbox-id: batch
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: centaur-batch-proxy
  namespace: centaur-system
  labels:
    app.kubernetes.io/name: centaur
    app.kubernetes.io/component: iron-proxy-batch
spec:
  podSelector:
    matchLabels:
      centaur.ai/iron-proxy: "true"
      centaur.ai/sandbox-id: batch
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
              app.kubernetes.io/instance: centaur
              app.kubernetes.io/name: centaur
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
        - port: 5432
          protocol: TCP
