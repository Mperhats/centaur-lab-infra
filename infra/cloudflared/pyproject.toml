[project]
name = "cloudflared-tunnel"
version = "0.1.0"
description = "Cloudflare Tunnel launchd-agent management for the centaur-lab dev stack"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tunnel = "cloudflared_tunnel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cloudflared_tunnel"]
